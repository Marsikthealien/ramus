group 'com.vitalex.ramus'
version '1.0-SNAPSHOT'

apply plugin: 'java'

dependencies {
    implementation project(':core')
    // Малювання діаграм і доступ до моделі IDEF0 як до дерева функцій:
    // PIDEF0painter, NDataPluginFactory, Function, Sector.
    implementation project(':idef0-common')
    implementation project(':idef0-core')
    runtimeOnly project(':report-core')
    runtimeOnly project(':chart-core')
    runtimeOnly 'com.h2database:h2:1.3.163'
    implementation project(':core-simple-attributes')
    implementation project(':common')
    implementation project(':data-framework-common')
    testImplementation group: 'junit', name: 'junit', version: '4.11'
}

test {
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

/**
 * Зручний запуск конвертера:
 * ./gradlew :ramus-core-demo:rsfToYaml -Prsf=<файл> -Pout=<каталог>
 */
tasks.register('rsfToYaml', JavaExec) {
    group = 'ramus'
    description = 'Конвертує .rsf у дерево YAML'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.ramussoft.demo.RsfToYaml'
    // Шляхи в аргументах зручніше писати відносно кореня репозиторію,
    // а не каталогу модуля.
    workingDir = rootProject.projectDir
    doFirst {
        if (!project.hasProperty('rsf') || !project.hasProperty('out')) {
            throw new GradleException(
                    'Потрібні -Prsf=<файл.rsf> та -Pout=<каталог>')
        }
        args = [project.property('rsf'), project.property('out')]
    }
}

/**
 * Зворотний конвертер:
 * ./gradlew :ramus-core-demo:yamlToRsf -Pin=<каталог> -Prsf=<файл.rsf>
 */
tasks.register('yamlToRsf', JavaExec) {
    group = 'ramus'
    description = 'Складає .rsf з дерева YAML'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.ramussoft.demo.YamlToRsf'
    workingDir = rootProject.projectDir
    doFirst {
        if (!project.hasProperty('in') || !project.hasProperty('rsf')) {
            throw new GradleException('Потрібні -Pin=<каталог> та -Prsf=<файл.rsf>')
        }
        args = [project.property('in'), project.property('rsf')]
    }
}

/**
 * Малювання діаграм без екрана:
 * ./gradlew :ramus-core-demo:renderDiagrams -Pin=<проєкт> -Pout=<каталог>
 * Необов'язкові: -Pformat=png|svg, -Psize=1600x1200
 */
tasks.register('renderDiagrams', JavaExec) {
    group = 'ramus'
    description = 'Малює всі діаграми проєкту у PNG або SVG'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.ramussoft.demo.ProjectToImages'
    workingDir = rootProject.projectDir
    doFirst {
        if (!project.hasProperty('in') || !project.hasProperty('out')) {
            throw new GradleException(
                    'Потрібні -Pin=<проєкт або .rsf> та -Pout=<каталог>')
        }
        args = [project.property('in'), project.property('out')]
        if (project.hasProperty('format'))
            args += project.property('format')
        if (project.hasProperty('size')) {
            if (!project.hasProperty('format'))
                args += 'png'
            args += project.property('size')
        }
    }
}

/**
 * Побудова моделі з текстового опису:
 * ./gradlew :ramus-core-demo:specToProject -Pspec=<опис.yaml> -Pout=<каталог>
 */
tasks.register('specToProject', JavaExec) {
    group = 'ramus'
    description = 'Будує проєкт Ramus з короткого опису моделі'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.ramussoft.demo.SpecToProject'
    workingDir = rootProject.projectDir
    doFirst {
        if (!project.hasProperty('spec') || !project.hasProperty('out')) {
            throw new GradleException(
                    'Потрібні -Pspec=<опис.yaml> та -Pout=<каталог проєкту>')
        }
        args = [project.property('spec'), project.property('out')]
    }
}
